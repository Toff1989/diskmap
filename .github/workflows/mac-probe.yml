name: Sonde macOS (temporaire)

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.variant }} #${{ matrix.rep }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base]
        rep: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Sonde
        run: |
          set +e
          python -X faulthandler .github/scripts/mac_probe.py ${{ matrix.variant }} 25
          code=$?
          echo "CODE-DE-SORTIE=$code"
          exit $code
