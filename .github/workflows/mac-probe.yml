name: Sonde macOS (temporaire)

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.variant }} #${{ matrix.rep }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base, nothread]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Sonde
        run: python .github/scripts/mac_probe.py ${{ matrix.variant }} 25
